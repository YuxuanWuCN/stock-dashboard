[pytest]
# BUG-0016: 裸 pytest -q 只从 tests/ 开始收集。根目录不再被扫描，因此：
# - ACL 损坏、无法删除的沙箱残留目录（股票分析项目.pytest_tmp 等）不会误入收集；
# - tools/ 下的脚本不会因同名/同模式文件被当作测试模块（import file mismatch）。
# 显式传入路径（pytest tools/xxx.py）仍可收集，不受此限制。
testpaths = tests
norecursedirs = 股票分析项目.pytest_tmp .pytest_tmp_win11 .pytest_tmp .pytest_cache .venv __pycache__ node_modules
# basetemp 必须留在工程内（BUG-0010~0014：%TEMP% 下的 pytest-of-<user>/pytest-current
# 是共享符号链接目录，多进程/多用户并发时报 WinError 5 拒绝访问）。
# 但它不能再嵌在 .pytest_cache 里：pytest 用不带 parents 的 mkdir 创建 basetemp，
# 而 .pytest_cache 由 cacheprovider 在 tmpdir 初始化之后才创建，全新检出或清过缓存
# 时父目录不存在 → 整套测试以 FileNotFoundError 全量报错。仓库根始终存在，故取一级目录。
addopts = --basetemp=.pytest_tmp

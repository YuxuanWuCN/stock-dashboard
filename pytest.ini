[pytest]
# BUG-0016: 裸 pytest -q 只从 tests/ 开始收集。根目录不再被扫描，因此：
# - ACL 损坏、无法删除的沙箱残留目录（股票分析项目.pytest_tmp 等）不会误入收集；
# - tools/ 下的脚本不会因同名/同模式文件被当作测试模块（import file mismatch）。
# 显式传入路径（pytest tools/xxx.py）仍可收集，不受此限制。
testpaths = tests
norecursedirs = 股票分析项目.pytest_tmp .pytest_tmp_win11 .pytest_cache .venv __pycache__ node_modules

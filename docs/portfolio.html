<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>量化组合实盘看板</title>
    <!-- 首屏主题引导：必须在样式表生效之前确定 data-theme，避免与 index.html 之间出现主题闪烁 -->
    <script>
        (function () {
            var THEME_KEY = 'fintech-theme';
            var theme = 'dark';
            try {
                var saved = window.localStorage.getItem(THEME_KEY);
                if (saved === 'light' || saved === 'dark') {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    theme = 'light';
                }
            } catch (error) {
                // 隐私模式或存储被禁用：回落默认暗色，且绝不阻塞后续脚本
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="assets/style.css?v=20260915_v11_frontend_professional">
    <link rel="stylesheet" href="assets/portfolio.css?v=20260915_v11_frontend_professional">
    <!-- 🌈 年轻化 FinTech 轻奢风覆盖层 -->
    <link rel="stylesheet" href="assets/style_young.css?v=20260915_v11_frontend_professional">
    <script src="https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="portfolio-header">
            <div class="header-nav">
                <a href="index.html" class="nav-back">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>返回智能看板</span>
                </a>
                <h1>
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    <span>量化组合实盘</span>
                </h1>
            </div>
            <div class="header-actions">
                <a href="index.html#/academic" class="portfolio-link academic-nav-link" title="跳转至学术研究成果与前沿实证">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                    <span>科研成果与实证</span>
                </a>
                <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="切换明暗主题" aria-pressed="false" title="切换明暗主题">
                    <svg class="theme-icon sun" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <span id="theme-toggle-text" class="theme-toggle-text">主题</span>
                </button>
                <a href="index.html#settings" class="portfolio-link settings-nav-link" title="系统与大模型 API 配置">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>⚙️ 设置</span>
                </a>
                <div id="update-time" class="update-time">数据加载中...</div>
            </div>
        </header>

        <!-- 今日市场情绪卡片 -->
        <section class="sentiment-section" id="sentiment-section">
            <div class="section-header">
                <h2>今日市场情绪</h2>
                <span id="sentiment-date" class="sentiment-date">--</span>
            </div>
            <div class="sentiment-grid">
                <div class="sentiment-card main-sentiment">
                    <div class="sentiment-label">市场情绪</div>
                    <div id="sentiment-mood" class="sentiment-mood">--</div>
                    <div class="sentiment-score-bar">
                        <div id="sentiment-score-fill" class="sentiment-score-fill" style="width: 0%"></div>
                    </div>
                    <div id="sentiment-score-text" class="sentiment-score-text">0/10</div>
                </div>
                <div class="sentiment-card">
                    <div class="sentiment-label">资金流向</div>
                    <div id="capital-flow" class="sentiment-value">--</div>
                </div>
                <div class="sentiment-card">
                    <div class="sentiment-label">热点板块</div>
                    <div id="hot-sectors" class="sentiment-value sectors">--</div>
                </div>
                <div class="sentiment-card recommend">
                    <div class="sentiment-label">推荐组合</div>
                    <div id="recommend-portfolio" class="recommend-name">--</div>
                    <div id="recommend-reason" class="recommend-reason">--</div>
                    <div id="recommend-position" class="recommend-position">建议仓位: --</div>
                </div>
            </div>
        </section>

        <!-- 6组合今日表现 -->
        <section class="portfolios-section">
            <div class="section-header">
                <h2>六大组合今日表现</h2>
                <div class="portfolio-legend">
                    <span class="legend-item"><span class="legend-dot aggressive"></span>激进成长</span>
                    <span class="legend-item"><span class="legend-dot robust"></span>妖股弹性</span>
                    <span class="legend-item"><span class="legend-dot defensive"></span>稳健防守</span>
                    <span class="legend-item"><span class="legend-dot tech"></span>科技主题</span>
                    <span class="legend-item"><span class="legend-dot bluechip"></span>蓝筹价值</span>
                    <span class="legend-item"><span class="legend-dot global"></span>全球配置</span>
                </div>
            </div>
            <div id="portfolios-grid" class="portfolios-grid">
                <!-- 动态填充 -->
            </div>
        </section>

        <!-- 累计收益曲线 -->
        <section class="chart-section">
            <div class="section-header">
                <h2>累计收益曲线对比</h2>
                <div class="chart-controls">
                    <button class="period-btn" data-period="7">近7天</button>
                    <button class="period-btn" data-period="30">近30天</button>
                    <button class="period-btn active" data-period="all">全部</button>
                </div>
            </div>
            <div class="chart-card">
                <div id="returns-chart" class="chart-element" style="height: 500px;"></div>
            </div>
        </section>

        <!-- 策略进化 -->
        <section class="evolution-section" id="evolution-section">
            <div class="section-header">
                <h2>策略进化追踪</h2>
                <span id="evolution-date" class="evolution-date">--</span>
            </div>
            <div id="evolution-content" class="evolution-content">
                <!-- 动态填充 -->
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="portfolio-footer">
            <p>本页面展示模拟盘数据，仅供研究学习，不构成投资建议</p>
        </footer>
    </div>

    <script>
        if (typeof echarts === 'undefined') {
            console.warn('Primary ECharts CDN failed, switching to backup...');
            var backupScript = document.createElement('script');
            backupScript.src = 'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js';
            document.head.appendChild(backupScript);
        }
    </script>
    <script>
        document.write('<script src="assets/portfolio.js?t=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>

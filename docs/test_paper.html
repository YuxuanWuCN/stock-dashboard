<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟盘修复测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        .test-item { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #2196F3; }
        .test-title { font-weight: bold; color: #2196F3; margin-bottom: 10px; }
        .test-result { font-family: monospace; white-space: pre-wrap; background: #263238; color: #aed581; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: 10px; }
        .status.success { background: #4CAF50; color: white; }
        .status.error { background: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 模拟盘显示修复测试</h1>
        <div id="results"></div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');

        // 修复后的函数
        function buildPaperSeries(records) {
            if (!records || !records.length) return [];
            var out = [];
            var nav = 100;
            records.forEach(function (r) {
                // 兼容字段名：portfolio_return_pct（新）或 daily_return_pct（旧）
                var dailyReturn = r.portfolio_return_pct != null ? r.portfolio_return_pct : (r.daily_return_pct || 0);
                nav = nav * (1 + dailyReturn / 100);
                out.push({ date: r.trade_date, nav: nav, daily: dailyReturn });
            });
            return out;
        }

        async function runTests() {
            const tests = [
                { name: '稳健组合', file: 'data/paper/performance.json', expectedField: 'portfolio_return_pct' },
                { name: '激进组合', file: 'data/paper/performance_aggressive.json', expectedField: 'portfolio_return_pct' },
                { name: '等权基准', file: 'data/paper/benchmark.json', expectedField: 'daily_return_pct' }
            ];

            for (const test of tests) {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-item';

                try {
                    const response = await fetch(test.file);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const series = buildPaperSeries(data.records || []);

                    const lastPoint = series[series.length - 1];
                    const firstPoint = series[0];
                    const totalReturn = lastPoint ? ((lastPoint.nav / 100 - 1) * 100).toFixed(2) : 'N/A';

                    const hasExpectedField = data.records && data.records[0] && (data.records[0][test.expectedField] != null);

                    testDiv.innerHTML = `
                        <div class="test-title">${test.name} <span class="status success">✓ 成功</span></div>
                        <div class="test-result">文件: ${test.file}
交易日数: ${series.length}
字段类型: ${test.expectedField} ${hasExpectedField ? '✓' : '✗'}
起始日期: ${firstPoint ? firstPoint.date : 'N/A'}
最新日期: ${lastPoint ? lastPoint.date : 'N/A'}
当日收益: ${lastPoint ? lastPoint.daily.toFixed(2) + '%' : 'N/A'}
累计收益: ${totalReturn}%
净值: ${lastPoint ? lastPoint.nav.toFixed(2) : 'N/A'}</div>
                    `;
                } catch (error) {
                    testDiv.innerHTML = `
                        <div class="test-title">${test.name} <span class="status error">✗ 失败</span></div>
                        <div class="test-result">错误: ${error.message}</div>
                    `;
                }

                resultsDiv.appendChild(testDiv);
            }
        }

        runTests();
    </script>
</body>
</html>

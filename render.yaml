services:
  - type: web
    name: yuxuanwucn-stock-dashboard-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://yuxuanwucn.github.io
      - key: ALLOW_WATCHLIST_WRITE
        value: "true"
      - key: LLM_BACKEND
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DAILY_UPDATE_ENABLED
        value: "true"
      - key: DAILY_UPDATE_TIME
        value: "17:30"
      # v2.5 新自选股自动入库与大模型配置：在 Render 控制台填写：
      # DEEPSEEK_API_KEY / GEMINI_API_KEY / GITHUB_TOKEN
      # 未配置 GITHUB_TOKEN 时同步自动关闭，网页加自选股仅保存在浏览器。

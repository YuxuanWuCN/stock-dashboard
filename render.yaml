services:
  - type: web
    name: yuxuanwucn-stock-dashboard-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://yuxuanwucn.github.io
      - key: ALLOW_WATCHLIST_WRITE
        value: "true"
      # v2.5 新自选股自动入库：配置后在 Render 控制台填写
      # GITHUB_TOKEN（PAT，contents 读写）、GITHUB_REPO（owner/repo）
      # 未配置时同步自动关闭，网页加自选股仅保存在浏览器。
